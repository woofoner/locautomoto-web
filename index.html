<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOCautomoto</title>
<script src="./app-data.js"></script>
</head>
<body>
<div style="font-family:system-ui;padding:24px">Chargement de LOCautomoto…</div>
<script>
(async()=>{
  try{
    const raw=Uint8Array.from(atob(window.LOC_APP_GZ_B64||''),c=>c.charCodeAt(0));
    const ds=new DecompressionStream('gzip');
    const stream=new Blob([raw]).stream().pipeThrough(ds);
    let html=await new Response(stream).text();
    const patch="\n<script id=\"loc-photo-border-final\">\n(function(){\n  const REQUIRED_KEYS=new Set(['idFront','idBack','permitFront','permitBack','travelTicket','addressProof','residenceProof']);\n\n  function docOk(key){\n    const d=window.photoDraft?.clientDocs?.[key];\n    if(!d?.src)return false;\n    return Number(d.edgeCount||0)===4;\n  }\n\n  function warn(key){\n    try{\n      const meta=document.getElementById('meta_clientDocs_'+key);\n      if(meta)meta.textContent='⚠️ 4 bords requis — reprendre la photo';\n      const card=document.getElementById('card_clientDocs_'+key);\n      if(card)card.classList.remove('done');\n      if(typeof toast==='function')toast('4 bords requis — recadre le document entièrement');\n    }catch(e){}\n  }\n\n  const baseCrop=window.cropDetectedDocument;\n  window.cropDetectedDocument=cropDetectedDocument=function(source,edges){\n    if(!source || !edges || Number(edges.count)!==4)return source;\n    const margin=Math.max(2,Math.round(Math.min(source.width,source.height)*0.008));\n    const x=Math.max(0,Math.round(edges.left.pos)-margin);\n    const y=Math.max(0,Math.round(edges.top.pos)-margin);\n    const r=Math.min(source.width,Math.round(edges.right.pos)+margin);\n    const b=Math.min(source.height,Math.round(edges.bottom.pos)+margin);\n    const w=r-x,h=b-y;\n    if(w<source.width*.45 || h<source.height*.35)return source;\n    const out=document.createElement('canvas');\n    const maxW=1600,scale=Math.min(1,maxW/w);\n    out.width=Math.max(1,Math.round(w*scale));\n    out.height=Math.max(1,Math.round(h*scale));\n    out.getContext('2d').drawImage(source,x,y,w,h,0,0,out.width,out.height);\n    return out;\n  };\n\n  const baseProcess=window.processDocumentLikeScanner;\n  if(typeof baseProcess==='function'){\n    window.processDocumentLikeScanner=processDocumentLikeScanner=async function(file){\n      const r=await baseProcess(file);\n      if(!r)return r;\n      r.cropped=Number(r.edgeCount||0)===4;\n      return r;\n    };\n  }\n\n  const baseContinue=window.continueReviewedDocument;\n  if(typeof baseContinue==='function'){\n    window.continueReviewedDocument=continueReviewedDocument=function(key=''){\n      if(REQUIRED_KEYS.has(key) && !docOk(key)){\n        warn(key);\n        try{showDocumentUnreadable?.(key,'4 bords non détectés — reprends la photo entière')}catch(e){}\n        return false;\n      }\n      return baseContinue(key);\n    };\n  }\n\n  const baseReadable=window.continueReadableClientDocument;\n  if(typeof baseReadable==='function'){\n    window.continueReadableClientDocument=continueReadableClientDocument=function(key=''){\n      if(REQUIRED_KEYS.has(key) && !docOk(key)){\n        warn(key);\n        return false;\n      }\n      return baseReadable(key);\n    };\n  }\n\n  const baseIdentityContinue=window.continueClientIdentityAutomatically;\n  if(typeof baseIdentityContinue==='function'){\n    window.continueClientIdentityAutomatically=continueClientIdentityAutomatically=function(){\n      const type=document.getElementById('cidDocType')?.value||'id';\n      if(!docOk('idFront')){warn('idFront');return false;}\n      if(type==='id' && !docOk('idBack')){warn('idBack');return false;}\n      return baseIdentityContinue();\n    };\n  }\n\n  document.addEventListener('change',e=>{\n    const input=e.target;\n    const m=String(input?.id||'').match(/^inp_clientDocs_(.+)$/);\n    if(!m)return;\n    const key=m[1];\n    if(!REQUIRED_KEYS.has(key))return;\n    setTimeout(()=>{\n      const d=window.photoDraft?.clientDocs?.[key];\n      if(d?.src && Number(d.edgeCount||0)!==4)warn(key);\n    },900);\n  },true);\n\n  window.LOC_PHOTO_BORDER_RULE={version:'final-4edges',required:[...REQUIRED_KEYS]};\n})();\n</script>";
    html=html.replace(/<\/body>/i,patch+'\n</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<pre style="white-space:pre-wrap;color:#fff;background:#111;padding:20px">Erreur de chargement LOCautomoto : '+String(e)+'</pre>';
  }
})();
</script>
</body>
</html>
